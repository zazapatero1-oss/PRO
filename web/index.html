<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#1f5f8b" />
    <meta name="description" content="Conversational patient-reported outcomes (AI-assisted inferred profile)" />
    <title>FACE-Q Conversation</title>
    <script>
      // GitHub Pages SPA redirect: 404.html encodes the deep link into ?/path; restore it here
      // before the router boots so /p/<token> and /clinician/... survive a hard reload.
      (function () {
        var l = window.location;
        if (l.search && l.search.charAt(1) === '/') {
          var decoded = l.search.slice(1).split('&').map(function (s) {
            return s.replace(/~and~/g, '&');
          }).join('?');
          window.history.replaceState(null, '', l.pathname.slice(0, -1) + decoded + l.hash);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
