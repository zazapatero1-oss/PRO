# Persona: English-speaking adult after a facelift who asks several medical
# questions and, at the end, corrects one thing in the patient summary.
id: en_adult_facelift_medical
language: en
population: adult
speaker: self
intake:
  display_name: "Margaret"
  preferred_language: en
  age_band: "50-69"
  reading_comfort: comfortable
  diagnosis_code: facelift
  diagnosis_text: "Lower facelift and neck lift, six weeks ago"
timepoint: post-op-6w
respondent: self
personality:
  style: asks-medical-questions
  description: >
    Organised, precise, slightly anxious. Medium-length answers. Keeps a
    notebook of symptoms. Asks the interviewer at least two medical questions
    during the conversation ("is this tightness normal?", "should the numbness
    have gone by now?") and accepts a non-answer gracefully. Wants things
    written down correctly.
backstory: >
  Margaret is 63, a school administrator. Six weeks after a lower facelift she
  is pleased with her neck and jawline. She has a persistent tight, pulling
  feeling in front of both ears, worse in the evening, and numbness of both
  earlobes. Swelling is minimal now. There is a small ridge in the scar behind
  the right ear that she can feel but not see. Her smile feels slightly stiff
  on the left when she is tired. She has been back at work for three weeks
  and is sleeping fine. She feels she looks about five years younger. She is
  happy with the decision but thinks the written information about how long
  numbness lasts was vague. She avoids nothing socially. Mood is good. When
  shown the summary she will correct that the tightness is in front of BOTH
  ears, not just one.
expected_focus: [adverse.numbness_sensation, adverse.pain_discomfort, adverse.scarring]
ground_truth:
  constructs:
    appearance.overall: none
    appearance.chin_jawline: none
    appearance.skin: none
    aging.appraisal: none
    psych.self_confidence: none
    psych.mood: none
    social.avoidance: none
    adverse.swelling_bruising: none
    adverse.numbness_sensation:
      severity: moderate
      facets:
        location: "both earlobes are completely numb"
        quality: "like they belong to someone else, no feeling at all"
        change_over_time: "no better than it was at three weeks, as far as I can tell"
        effect_on_daily_things: "I catch them with my earrings and don't feel it"
        noticing_it: "most when I put my glasses on or wash my hair"
    adverse.scarring:
      severity: mild
      facets:
        location: "behind both ears, up into the hairline"
        visibility: "nobody can see them, my hair covers it"
        texture_raised: "there is a small ridge behind the right ear I can feel"
        colour: "still pink but fading"
        itching_tightness: "itchy behind the right ear in the evening"
        change_over_time: "flatter than they were a month ago"
    adverse.pain_discomfort:
      severity: mild
      facets:
        location: "in front of both ears, the tight pulling"
        quality: "tight and pulling rather than sharp"
        timing_of_day: "worse in the evening, by about six o'clock"
        severity_scale: "two or three out of ten, never more"
        relief: "it eases if I lie down or stop talking for a while"
        effect_on_activities: "it doesn't stop me doing anything"
    function.facial_expression: mild
    recovery.daily_activities: none
    outcome.result: none
    outcome.decision: none
    outcome.information: mild
  narrative_facts:
    - text: "Tight, pulling feeling in front of both ears, worse in the evening"
      construct_id: adverse.pain_discomfort
      match_any: ["tight", "pull", "evening", "in front of"]
    - text: "Numb earlobes"
      construct_id: adverse.numbness_sensation
      match_any: ["earlobe", "ear lobe", "lobe", "ears"]
    - text: "Small ridge in the scar behind the right ear"
      construct_id: adverse.scarring
      match_any: ["ridge", "behind", "right ear", "lump", "bump"]
    - text: "Smile slightly stiff on the left when tired"
      construct_id: function.facial_expression
      match_any: ["smile", "stiff", "tired"]
    - text: "Written information on how long numbness lasts was vague"
      construct_id: outcome.information
      match_any: ["vague", "leaflet", "written", "information", "how long"]
    - text: "Back at work for three weeks"
      construct_id: recovery.daily_activities
      match_any: ["work", "three weeks"]
expected_behaviours:
  declines: []
  asks_medical_question: true
  medical_question: "Is the tightness in front of my ears normal at six weeks, and should the numbness have gone by now?"
  medical_question_keywords: ["tight", "numb", "normal"]
  safety_intercept_expected: false
  summary_correction:
    construct_id: adverse.pain_discomfort
    patient_text: "The tight pulling feeling is in front of both ears, not just one side."
