# Persona: evasive adult considering injectables. Deflects with humour and
# generalities, and refuses one topic outright (social avoidance) once asked.
id: en_adult_injectables_evasive
language: en
population: adult
speaker: self
intake:
  display_name: "Priya"
  preferred_language: en
  age_band: "30-49"
  reading_comfort: comfortable
  diagnosis_code: injectables
  diagnosis_text: "Considering filler for lips and cheeks, botox for forehead lines"
timepoint: baseline
respondent: self
personality:
  style: evasive
  description: >
    Deflects with humour, hedges ("I guess", "it's fine, honestly"), changes the
    subject to logistics or cost, and gives the real answer only after a second
    or third gentle follow-up. Polite. When asked about avoiding social
    situations, declines clearly ("I'd rather not get into that") and does not
    return to it even if pushed.
backstory: >
  Priya is 38 and works in marketing. She has thin lips she has always disliked
  and cheeks that have "gone flat" in the last few years. Forehead lines bother
  her in office video calls; she keeps her camera slightly above eye level to
  hide them. She feels older than her age in photos. She is genuinely quite
  self-conscious and her mood dips when she sees photos of herself, though she
  would never call it distress. She has started to avoid after-work drinks and
  turned down a friend's wedding-party role, but she will not discuss that.
expected_focus: [appearance.lips, appearance.cheeks, aging.appraisal, psych.self_confidence]
ground_truth:
  constructs:
    appearance.overall: moderate
    appearance.lips:
      severity: severe
      facets:
        shape: "the top lip basically disappears when I smile"
        fullness: "they've always been thin, that's the main thing"
        symmetry: "they're even enough, I suppose"
        smile_movement: "when I smile it just vanishes, that's the bit I hate"
        wanted_change: "a bit more there, nothing dramatic, I don't want the duck look"
        since_when: "since my twenties, honestly since always"
    appearance.cheeks:
      severity: moderate
      facets:
        fullness: "they've gone flat, like the air's been let out"
        contour_change: "it happened over the last three or four years"
        photos_vs_mirror: "in photos they look hollow, in the mirror it's not as bad"
        wanted_change: "just a bit of lift back where it used to be"
    appearance.skin: mild
    appearance.eyes: none
    aging.appraisal:
      severity: moderate
      facets:
        perceived_age: "in photos I look older than I am, easily mid-forties"
        compared_to_peers: "my friends the same age look fresher, or they're just better at photos"
        which_features_age: "the forehead lines and the flat cheeks"
        photos_vs_mirror: "the mirror is fine, photos are the problem"
        comments_from_others: "nobody's said anything, it's just me"
    psych.self_confidence:
      severity: moderate
      facets:
        with_strangers: "fine with strangers, they don't know what I looked like"
        at_work_or_school: "video calls are the worst part of my week"
        in_photos: "I hate being photographed, I'll take the picture instead"
        getting_ready: "more make-up than I used to, takes longer"
        what_helps: "good lighting, honestly"
    psych.mood: mild
    distress.hiding: moderate
    social.avoidance: declined
    social.comfort: mild
  narrative_facts:
    - text: "Keeps the camera above eye level on video calls to hide forehead lines"
      construct_id: distress.hiding
      match_any: ["camera", "video call", "video calls", "angle", "above eye"]
    - text: "Has always disliked her thin lips"
      construct_id: appearance.lips
      match_any: ["thin", "lips"]
    - text: "Cheeks have gone flat over the last few years"
      construct_id: appearance.cheeks
      match_any: ["flat", "cheek", "volume", "sunken"]
    - text: "Feels older than her age in photos"
      construct_id: aging.appraisal
      match_any: ["older", "photo", "her age", "look my age"]
expected_behaviours:
  declines: [social.avoidance]
  decline_keywords: ["social", "avoid", "going out", "events", "drinks", "party", "wedding"]
  asks_medical_question: false
  safety_intercept_expected: false
