# Ground-truth construct ids used by every persona in this directory.
#
# This is the ONE place where persona ground truth is tied to construct ids.
# The ids are the real ids of the seeded `face-q-adult` (33) and
# `face-q-pediatric` (31) maps (workstream A). The scorer still fetches the
# approved map at run time and reports every id listed here that is NOT present
# in it (`unknown_ground_truth_ids`), so a future rename is a one-file edit.
#
# `populations` lists which ids exist in which map; persona validation fails if
# a persona references an id outside its population's list. `post_op_only`
# lists ids whose `applicable_timepoints` exclude baseline/pre-op; baseline
# personas must not carry ground truth for them.
#
# `label` is the clinician-facing label (fallback keywords when scoring "was a
# declined topic re-asked?"). `patient_topic` / `patient_topic_es` are
# plain-language topic phrases given to the simulated patient. Neither field
# contains instrument item text.
populations:
  adult:
    - appearance.overall
    - appearance.nose
    - appearance.eyes
    - appearance.lips
    - appearance.cheeks
    - appearance.chin_jawline
    - appearance.skin
    - appearance.smile_teeth
    - psych.self_confidence
    - psych.self_acceptance
    - psych.mood
    - social.comfort
    - social.avoidance
    - social.teasing_comments
    - social.relationships
    - distress.preoccupation
    - distress.hiding
    - distress.cancer_worry
    - function.breathing
    - function.eating_drinking
    - function.speaking
    - function.facial_expression
    - function.swallowing_oral
    - adverse.pain_discomfort
    - adverse.swelling_bruising
    - adverse.numbness_sensation
    - adverse.scarring
    - adverse.asymmetry
    - recovery.daily_activities
    - outcome.result
    - outcome.decision
    - outcome.information
    - aging.appraisal
  pediatric:
    - appearance.overall
    - appearance.nose
    - appearance.eyes
    - appearance.lips
    - appearance.ears
    - appearance.cheeks
    - appearance.chin_jawline
    - appearance.smile_teeth
    - appearance.skin
    - psych.self_confidence
    - psych.self_acceptance
    - psych.mood
    - social.comfort
    - social.school
    - social.teasing_comments
    - social.avoidance
    - distress.preoccupation
    - distress.hiding
    - function.breathing
    - function.eating_drinking
    - function.speaking
    - function.facial_expression
    - adverse.pain_discomfort
    - adverse.swelling_bruising
    - adverse.numbness_sensation
    - adverse.scarring
    - adverse.asymmetry
    - recovery.daily_activities
    - outcome.result
    - outcome.decision
    - outcome.information
post_op_only:
  - recovery.daily_activities
  - outcome.result
  - outcome.decision
  - outcome.information
