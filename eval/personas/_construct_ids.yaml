# Ground-truth construct ids used by every persona in this directory.
#
# This is the ONE place where persona ground truth is tied to construct ids.
# The ids follow the SPEC §6 naming convention (`domain.construct`) and are our
# best guess at the ids in the seeded `face-q-adult` / `face-q-pediatric` maps.
# The scorer fetches the real, approved map at run time and reports every id
# listed here that is NOT present in that map (`unknown_ground_truth_ids`), so
# reconciling with the real map is a one-file edit: rename the key here and
# every persona follows.
#
# `label` is the clinician-facing label (used as fallback keywords when scoring
# "was a declined topic re-asked?").  `patient_topic` is a plain-language
# description of the topic, given to the simulated patient so it knows which
# question to decline / which topic a fact belongs to.  Neither field contains
# instrument item text.
constructs:
