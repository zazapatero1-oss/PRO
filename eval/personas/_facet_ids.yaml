# Facet ids used by persona ground truth (SPEC v1.1 §A).
#
# GENERATED FROM THE SEEDED MAPS - do not invent ids here. Source of truth:
#   supabase/seed/construct_maps/face-q-adult.json
#   supabase/seed/construct_maps/face-q-pediatric.json
# `constructs` is the union of both maps' facet ids per construct, with the
# adult label where the two populations word the same id differently (72 of them
# do; the wording is cosmetic, the id is what matters). `populations` is the
# authoritative split: a persona may only use facet ids listed for ITS
# population, because the same construct has different facets in the two maps
# (e.g. adult `appearance.lips.fullness` does not exist in the pediatric map).
#
# `tests/test_personas.py` regenerates this file's content from the maps and
# fails on any drift, whenever the maps are present and carry facets. The
# scorer additionally reconciles ground-truth facet ids against the map fetched
# at run time and reports `unknown_facet_ids`, so a rename shows up either way.
#
# Labels are paraphrased drill-down details, never instrument item text.
constructs:
  appearance.overall:
    whole_face: "How the face works together as a whole, not one feature"
    features_named: "Which features bother them most, in their own words"
    mirror_vs_photos: "How it looks in the mirror versus photos and video"
