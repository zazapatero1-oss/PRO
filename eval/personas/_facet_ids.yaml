# Facet ids used by persona ground truth (SPEC v1.1 §A).
#
# This is the ONE place where persona facet ground truth is tied to facet ids.
# Each construct in `_construct_ids.yaml` lists the facet ids of the seeded
# maps (workstream A2) with a short clinician-facing label. Personas reference
# these ids under `ground_truth.constructs.<id>.facets`; validation fails on an
# id that is not listed here, and the scorer additionally reconciles every
# ground-truth facet id against the construct map fetched at run time and
# reports the ones the map does not have (`unknown_facet_ids`), exactly like
# the construct-id check. A rename in the seed maps is therefore a one-file
# edit here plus the persona keys.
#
# Labels are paraphrased drill-down details, never instrument item text.
constructs:
