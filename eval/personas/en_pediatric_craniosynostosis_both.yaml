# Persona: father and 15-year-old daughter together, six weeks after a
# cranio-facial revision. The father types; the teen chips in through him.
id: en_pediatric_craniosynostosis_both
language: en
population: pediatric
speaker: both
intake:
  display_name: "Nia"
  preferred_language: en
  age_band: "13-17"
  reading_comfort: comfortable
  diagnosis_code: craniosynostosis
  diagnosis_text: "Unicoronal craniosynostosis, repaired in infancy; forehead and orbital contouring 6 weeks ago"
timepoint: post-op-6w
respondent: both
clinician_note:
  note: "Please pay attention to how she is feeling about school and how the forehead looks to her now."
  focus_constructs: [social.school, appearance.overall, adverse.swelling_bruising]
personality:
  style: chatty
  description: >
    The speaker is Nia's father, Sam, with Nia sitting next to him. Sam types
    most replies and is chatty and reassuring, sometimes over-explaining. He
    relays Nia's own words in quotes ("Nia says: 'it's fine, dad'") and
    occasionally lets her type a short, dry teenage reply herself, marked with
    "[Nia]". They disagree mildly about how much she cares about the forehead.
backstory: >
  Nia is 15. She had surgery as a baby and a contouring operation on her
  forehead and eye socket six weeks ago. The left brow used to sit visibly
  higher than the right; it is now nearly level and she says it "finally looks
  normal". There is still puffiness around the left eye in the mornings and a
  numb patch on the scalp near the scar, which she describes as "weird, not
  bad". The scar is hidden in the hairline. She went back to school two weeks
  ago and is fine with friends but skipped the swim club because she does not
  want the scar seen wet. Headaches at night the first two weeks, gone now. Sam
  thinks she is more confident; Nia says she was already fine. Both are happy
  with the decision and felt well informed.
# The clinician note weights school, overall appearance and swelling, so triage
# should surface those plus the numbness she keeps mentioning.
expected_focus: [appearance.overall, social.school, adverse.swelling_bruising, adverse.numbness_sensation]
ground_truth:
  constructs:
    appearance.overall:
      severity: mild
      facets:
        whole_face: "Nia says it finally looks normal to her"
        features_named: "it was always the brow, the left one sat higher"
        photos_mirror: "she says photos are fine now, she didn't like side-on ones before"
        wanted_change: "[Nia] nothing now, it's fine"
    appearance.eyes: mild
    psych.self_confidence: mild
    psych.mood: none
    social.comfort: none
    social.school:
      severity: none
      facets:
        peer_reactions: "she went back two weeks ago, her friends were great about it"
        participation: "no problem in lessons, she's caught up already"
        activities_avoided: "she's skipped swim club, that's the one thing"
        school_support: "school were good, they let her sit out PE"
        attendance: "four weeks off in total"
    adverse.swelling_bruising:
      severity: mild
      facets:
        location: "around the left eye, the lower lid mostly"
        trajectory: "much less than it was, it was both eyes at first"
        extent: "[Nia] only I notice it"
    adverse.numbness_sensation:
      severity: mild
      facets:
        location: "a patch on the scalp near the scar"
        quality: "[Nia] weird, not bad, like it's not mine"
        trajectory: "smaller than it was"
        daily_effect: "brushing her hair feels odd over that bit"
        touching: "mostly when she washes her hair"
    adverse.scarring: none
    adverse.asymmetry: none
    adverse.pain_discomfort: none
    recovery.daily_activities: mild
    outcome.result: none
    outcome.decision: none
  narrative_facts:
    - text: "Left brow used to sit higher; now nearly level"
      construct_id: adverse.asymmetry
      match_any: ["brow", "eyebrow", "level", "higher", "even"]
    - text: "Puffiness around the left eye in the mornings"
      construct_id: adverse.swelling_bruising
      match_any: ["morning", "puffy", "puffiness", "left eye"]
    - text: "Numb patch on the scalp near the scar"
      construct_id: adverse.numbness_sensation
      match_any: ["scalp", "patch", "numb", "weird"]
    - text: "Skipped swim club because she does not want the scar seen wet"
      construct_id: social.avoidance
      match_any: ["swim", "pool", "wet", "hair"]
    - text: "Night headaches in the first two weeks, gone now"
      construct_id: adverse.pain_discomfort
      match_any: ["headache", "first two weeks", "gone now", "at night"]
expected_behaviours:
  declines: []
  asks_medical_question: false
  safety_intercept_expected: false
