[project]
name = "faceq-eval"
version = "0.1.0"
description = "Evaluation harness for FACE-Q Conversation: simulated patients with hidden ground truth."
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2",
    "pyyaml>=6",
    "rich>=13",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["faceq_eval"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
